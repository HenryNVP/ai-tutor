[pytest]
# Pytest configuration for AI Tutor tests

# Test markers
markers =
    unit: Unit tests (no dependencies, fast)
    integration: Integration tests (mocked services)
    e2e: End-to-end tests (full system, may require API keys)
    mcp: Tests that require real MCP servers to be running

# Test discovery patterns
# Tests are organized in subfolders: unit/, integration/, e2e/
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests

# Default test execution
# Run only unit tests by default to avoid crashes
# Use -m "" to run all tests
# MCP tests are skipped by default (require servers running)
addopts = 
    -v
    --tb=short
    -m "not e2e and not mcp"

# Coverage (if pytest-cov is installed)
# [tool:pytest]
# addopts = --cov=ai_tutor --cov-report=term-missing

