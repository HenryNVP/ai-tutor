# Example configuration for using Gemini with Note Agent
# Copy relevant sections to your config/default.yaml

project_name: "AI Tutor with Gemini"

# LLM Configuration (main model for other agents)
model:
  name: "gpt-4o-mini"
  provider: "openai"
  temperature: 0.15
  max_output_tokens: 2048
  mode: "chat"

# Embedding Model Configuration
embeddings:
  model: "BAAI/bge-base-en"
  provider: "sentence-transformers"
  batch_size: 256
  normalize: true
  dimension: null

# Document Chunking Configuration
chunking:
  chunk_size: 500
  chunk_overlap: 80
  tokenizer: null

# Retrieval Configuration
retrieval:
  top_k: 5

paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  vector_store_dir: "data/vector_store"
  chunks_index: "data/processed/chunks.jsonl"
  logs_dir: "logs"
  profiles_dir: "data/processed/profiles"

logging:
  level: INFO
  use_json: false

course_defaults:
  weeks: 12
  lessons_per_week: 3
  domains:
    - "math"
    - "physics"
    - "cs"

demo_mode: true

# Note Agent Configuration - Using Gemini for large context window
note_agent:
  # Use Gemini 1.5 Pro for best quality (1M token context window)
  model: "gemini/gemini-1.5-pro"
  
  # Or use Gemini 1.5 Flash for faster, cost-effective option:
  # model: "gemini/gemini-1.5-flash"
  
  # API key (set via GEMINI_API_KEY env var or here)
  api_key: null  # Set to your API key or use: export GEMINI_API_KEY="your-key"
  
  # Enable full document context processing
  use_full_context: true

